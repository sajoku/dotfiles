# Apple System Colors (dark)
set -g status-style "bg=#0f0f0f,fg=#98989d"
set -g window-style "bg=#1a1a1a,fg=#ffffff"
set -g window-active-style "bg=#1e1e1e,fg=#ffffff"
set -g pane-border-style "fg=#0f0f0f,bg=#0f0f0f"
set -g pane-active-border-style "fg=#0f0f0f,bg=#0f0f0f"

# card header: rounded title chip, icon, title, path, clickable controls (tmux 3.7+)
set -g pane-border-format "#[fill=#{?pane_active,#3a3a3c,#232325}]#[bg=#0f0f0f,fg=#{?pane_active,#3a3a3c,#232325}]\ue0b6#[bg=#{?pane_active,#3a3a3c,#232325},fg=#0a84ff] \uf489 #[fg=#ffffff,bold]#{pane_current_command}#[nobold,fg=#98989d]  #{b:pane_current_path}#[align=right]#[fg=#98989d]#[range=control|1] \ueb56 #[norange]#[range=control|2] \ueb57 #[norange]#[range=control|3] \ueb4c #[norange]#[range=control|4] \uea76 #[norange]#[bg=#0f0f0f,fg=#{?pane_active,#3a3a3c,#232325}]\ue0b4"

# rounded tab strip: container pill with an active pill inside
set -g status-left "#[fg=#ffffff,bold] #S #[nobold,fg=#98989d]#H   "
set -g status-right "#[fg=#98989d]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#{?window_start_flag,#[bg=#0f0f0f fg=#232325]\ue0b6,}#[bg=#232325,fg=#98989d] #I #W #{?window_end_flag,#[bg=#0f0f0f fg=#232325]\ue0b4,}"
setw -g window-status-current-format "#{?window_start_flag,#[bg=#0f0f0f fg=#232325]\ue0b6,}#[bg=#232325,fg=#3a3a3c]\ue0b6#[bg=#3a3a3c,fg=#ffffff,bold] #I #W #[bg=#232325,fg=#3a3a3c,nobold]\ue0b4#{?window_end_flag,#[bg=#0f0f0f fg=#232325]\ue0b4,}"
