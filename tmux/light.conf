# Muliphen — dark
# Pill colours
set -g @mu_midnight '#0b1026'
set -g @mu_indigo   '#232c6b'
set -g @mu_soft     '#b8c6ff'
set -g @mu_lavender '#c4b5fd'
set -g @mu_amber    '#ffc46b'
set -g @mu_coral    '#ff6b8b'
# Mode-specific
set -g @mu_dim      '#6b74a8'

set -g status-style 'fg=#b8c6ff,bg=default'

set -g pane-border-style        'fg=#232c6b'
set -g pane-active-border-style 'fg=#b8c6ff'
set -g popup-border-style       'fg=#b8c6ff'

set -g message-style         'fg=#0b1026,bg=#b8c6ff,bold'
set -g message-command-style 'fg=#0b1026,bg=#c4b5fd,bold'
setw -g mode-style           'fg=#0b1026,bg=#b8c6ff'

setw -g window-status-bell-style     'fg=#ff6b8b,bold'
setw -g window-status-activity-style 'fg=#ffc46b'

set -g display-panes-colour        '#6b74a8'
set -g display-panes-active-colour '#b8c6ff'
setw -g clock-mode-colour          '#b8c6ff'
