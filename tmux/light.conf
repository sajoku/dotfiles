# Apple System Colors (light)
set -g status-style "bg=#e5e5ea,fg=#7a7a7e"
set -g window-style "bg=#f2f2f7,fg=#000000"
set -g window-active-style "bg=#feffff,fg=#000000"
set -g pane-border-style "fg=#e5e5ea,bg=#e5e5ea"
set -g pane-active-border-style "fg=#e5e5ea,bg=#e5e5ea"

# card header: rounded title chip, icon, title, path, clickable controls (tmux 3.7+)
set -g pane-border-format "#[fill=#{?pane_active,#feffff,#d6d6dc}]#[bg=#e5e5ea,fg=#{?pane_active,#feffff,#d6d6dc}]\ue0b6#[bg=#{?pane_active,#feffff,#d6d6dc},fg=#0869cb] \uf489 #[fg=#000000,bold]#{pane_current_command}#[nobold,fg=#7a7a7e]  #{b:pane_current_path}#[align=right]#[fg=#7a7a7e]#[range=control|1] \ueb56 #[norange]#[range=control|2] \ueb57 #[norange]#[range=control|3] \ueb4c #[norange]#[range=control|4] \uea76 #[norange]#[bg=#e5e5ea,fg=#{?pane_active,#feffff,#d6d6dc}]\ue0b4"

# rounded tab strip: container pill with an active pill inside
set -g status-left "#[fg=#000000,bold] #S #[nobold,fg=#7a7a7e]#H   "
set -g status-right "#[fg=#7a7a7e]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#{?window_start_flag,#[bg=#e5e5ea fg=#d6d6dc]\ue0b6,}#[bg=#d6d6dc,fg=#7a7a7e] #I #W #{?window_end_flag,#[bg=#e5e5ea fg=#d6d6dc]\ue0b4,}"
setw -g window-status-current-format "#{?window_start_flag,#[bg=#e5e5ea fg=#d6d6dc]\ue0b6,}#[bg=#d6d6dc,fg=#feffff]\ue0b6#[bg=#feffff,fg=#000000,bold] #I #W #[bg=#d6d6dc,fg=#feffff,nobold]\ue0b4#{?window_end_flag,#[bg=#e5e5ea fg=#d6d6dc]\ue0b4,}"
