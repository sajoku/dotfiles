# colours follow the terminal's light/dark theme
set-hook -g client-light-theme 'source-file ~/.config/tmux/light.conf'
set-hook -g client-dark-theme 'source-file ~/.config/tmux/dark.conf'
set-hook -g client-attached 'if -F "#{==:#{client_theme},light}" "source-file ~/.config/tmux/light.conf" "source-file ~/.config/tmux/dark.conf"'
# source-file ~/.config/tmux/dark.conf


run ~/.config/tmux/plugins/tmux-cpu-118ae26fcdc7/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery-24207c4e302d/battery.tmux

# ============================================================
# PLUGINS (tpm)
# ============================================================

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'

run 'tpack init'
