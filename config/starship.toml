"$schema" = "https://starship.rs/config-schema.json"

palette = "muliphen"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

# Only shown over SSH or as root, like before
[username]
format = "[ $user ]($style)"
style_user = "bold fg:midnight bg:blue"
style_root = "bold fg:midnight bg:coral"

[hostname]
format = "[ $ssh_symbol$hostname ]($style)"
ssh_symbol = "⇄ "
style = "bold fg:midnight bg:lavender"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:midnight bg:soft"
read_only = " ⊘ "
read_only_style = "bold fg:soft bg:coral"
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
format = "[ $branch ]($style)"
style = "fg:soft bg:indigo"

[git_state]
format = "([ $state( $progress_current/$progress_total) ]($style))"
style = "bold fg:midnight bg:amber"

# The pill only appears when there is something to report
[git_status]
format = "([ $all_status$ahead_behind ]($style))"
style = "bold fg:midnight bg:lavender"
conflicted = "="
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "−"
stashed = "≡"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕"

[cmd_duration]
format = " [$duration]($style)"
style = "bold fg:amber"

[python]
format = "[($virtualenv )]($style)"
style = "italic fg:lavender"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[→](bold glow)"
error_symbol = "[λ](bold coral)"
vimcmd_symbol = "[←](bold lavender)"

[palettes.muliphen]
midnight = "#0b1026"
indigo = "#232c6b"
blue = "#5b7cff"
glow = "#8fa8ff"
soft = "#b8c6ff"
lavender = "#c4b5fd"
amber = "#ffc46b"
coral = "#ff6b8b"
