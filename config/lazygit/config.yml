# Lume — Lume (dark)
# https://github.com/danfry1/lume

gui:
  theme:
    activeBorderColor:
      - '#dc8a78'
      - bold
    inactiveBorderColor:
      - '#6c6f85'
    searchingActiveBorderColor:
      - '#df8e1d'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    inactiveViewSelectedLineBgColor:
      - '#9ca0b0'
    cherryPickedCommitFgColor:
      - '#dc8a78'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    markedBaseCommitFgColor:
      - '#1e66f5'
    markedBaseCommitBgColor:
      - '#df8e1d'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'
  authorColors:
    '*': '#7287fd'
customCommands:
  - key: '<c-g>'
    context: 'files'
    description: 'AI commit message (review in editor)'
    command: |
      sh -c 'f=$(mktemp); echo "Generating commit message..."; git diff --staged | aicommit > "$f" && git commit -e -F "$f"; rm -f "$f"'
    output: terminal
